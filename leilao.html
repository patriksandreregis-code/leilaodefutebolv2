<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Leilão de Futebol — Resenha do Fut</title>
<meta name="theme-color" content="#080d0b">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="icon" href="/favicon.ico">
<link rel="manifest" href="/site.webmanifest">
<meta name="description" content="Leilão de Futebol do Resenha do Fut: dispute craques e monte seu elenco com os amigos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{color-scheme:dark;--bg:#080d0b;--card:#101713;--line:#29372d;--tx:#f4f6f4;--mu:#a6b0a8;--ac:#a8ff3f;--ok:#4ad295;--bad:#ff6b6b;--blue:#83b6ff}
html{scroll-behavior:smooth}
body{background:radial-gradient(ellipse at 82% -5%,rgba(168,255,63,.12),transparent 34%),var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:var(--mu);text-decoration:none}
a:hover{color:var(--ac)}
.site-header{width:min(1120px,calc(100% - 40px));height:82px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid #26332b}
.site-brand{display:flex;align-items:center;gap:12px;color:var(--tx);font-weight:900;letter-spacing:-.6px}
.site-brand-icon{width:52px;height:56px;display:block;object-fit:contain}
.site-brand-name{font-size:17px;line-height:1.02}
.site-brand-name span{display:block;color:var(--ac);font-family:"Barlow Condensed",Impact,sans-serif;font-style:italic;font-size:21px;letter-spacing:.3px}
.site-nav{display:flex;align-items:center;gap:20px;font-size:13px;font-weight:700}
.site-nav .home-cta{background:var(--ac);color:#101810;padding:10px 14px;border-radius:9px}
@media(max-width:600px){.site-header{width:calc(100% - 28px);height:70px}.site-brand-icon{width:44px;height:48px}.site-nav{gap:9px}.site-nav a:not(.home-cta){display:none}.site-brand-name{font-size:15px}}

:root{--bg:#080d0b;--card:#101713;--line:#29372d;--tx:#f4f6f4;--mu:#a6b0a8;--ac:#a8ff3f;--ok:#4ad295;--bad:#ff6b6b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 Inter,system-ui,sans-serif}
h1,h2,.big{font-family:'Barlow Condensed',Impact,sans-serif;margin:0}
button,input,select{font:inherit;border-radius:6px;border:1px solid var(--line)}
input,select{background:#0b100d;color:var(--tx);padding:.5rem .7rem}input{width:100%}select{width:auto}
button{background:var(--card);color:var(--tx);padding:.5rem .9rem;cursor:pointer;font-weight:600}
button.pri{background:var(--ac);color:#241a00;border-color:var(--ac)}button:disabled{opacity:.35;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
a{color:var(--mu)}.mu{color:var(--mu)}.ok{color:var(--ok)}.bad{color:var(--bad)}
.wrap{width:min(1120px,calc(100% - 40px));margin:0 auto;padding:1.25rem 0}
#join{max-width:420px;margin:7vh auto;display:grid;gap:.7rem}#join h1{font-size:3rem;line-height:1}
.top{display:flex;justify-content:space-between;align-items:center;gap:.6rem;flex-wrap:wrap;margin-bottom:1rem}
.grid{display:grid;grid-template-columns:3fr 2fr;gap:1rem}@media(max-width:780px){.grid{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:1rem;margin-bottom:1rem}
.pos{background:var(--ac);color:#241a00;font-weight:700;padding:.1rem .6rem;border-radius:99px;font-size:.85rem}
.lot h1{font-size:3.4rem;line-height:1;margin:.5rem 0 .2rem}.big{font-size:2.6rem;font-weight:800;color:var(--ac)}
.track{height:10px;background:#0b100d;border-radius:99px;overflow:hidden;margin:.8rem 0 .3rem}#bar{height:100%;width:100%}
.row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-top:.7rem}
#bidbar input{width:7.5rem}
.pl{border-top:1px solid var(--line);padding:.55rem 0}.pl:first-child{border:0;padding-top:0}
.pl.me{background:#1b2a1b;margin:0 -.5rem;padding:.55rem .5rem;border-radius:6px}
.chip{display:inline-block;background:#0b100d;border-radius:4px;padding:0 .4rem;margin:.15rem .2rem 0 0;font-size:.85rem}
.x{padding:0 .4rem;margin-left:.2rem;font-size:.8rem}
.log{font-size:.9rem;color:var(--mu)}.log div:last-child{color:var(--tx)}
#chatlog{height:150px;overflow:auto;background:#0b100d;border-radius:6px;padding:.4rem .6rem;font-size:.9rem;margin-bottom:.5rem}
.cfg{display:grid;grid-template-columns:auto 1fr;gap:.5rem .8rem;align-items:center;margin:.8rem 0}
table{width:100%;border-collapse:collapse;font-size:.92rem}td,th{text-align:left;padding:.35rem .4rem;border-top:1px solid var(--line);vertical-align:top}
.tabs{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.7rem}.tabs button{padding:.3rem .7rem}
.field{position:relative;display:flex;flex-direction:column;justify-content:space-around;height:340px;padding:.6rem;background:#1d633b linear-gradient(#e8f5ec,#e8f5ec) center/100% 2px no-repeat;border:2px solid #e8f5ec;border-radius:8px}
.field::after{content:'';position:absolute;left:50%;top:50%;width:72px;height:72px;border:2px solid #e8f5ec;border-radius:50%;transform:translate(-50%,-50%)}
.fr{display:flex;justify-content:space-around;position:relative;z-index:1}.sl{flex:1;max-width:76px;text-align:center}
.dot{width:42px;height:42px;border-radius:50%;margin:0 auto;border:2px dashed #e8f5eccc;display:grid;place-items:center;font-weight:700}
.dot.f{background:var(--ac);color:#241a00;border:2px solid #fff}
.sl small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.75rem;text-shadow:0 1px 2px #000}
details{margin:.3rem 0}summary{cursor:pointer}
</style>
</head>
<body>
<div id="net" hidden style="position:fixed;top:0;left:0;right:0;z-index:50;background:#5c1f24;color:#fff;text-align:center;padding:.45rem;font-weight:600">Sem conexão. Reconectando… sua partida continua.</div>
<header class="site-header">
<a class="site-brand" href="/" aria-label="Resenha do Fut - início"><img class="site-brand-icon" src="/logo.png" alt="Logo Resenha do Fut"><span class="site-brand-name">RESENHA<span>DO FUT.</span></span></a>
<nav class="site-nav" aria-label="Navegação principal"><a href="/">Início</a><a href="/leilao">Leilão</a><a href="/dado">Dado da Copa</a><a class="home-cta" href="/">Menu de jogos ↗</a></nav>
</header>
<div id="join" class="panel">
  <a href="/">← Voltar ao menu</a>
  <h1>Leilão de Futebol</h1>
  <p class="mu">Dê lances nos craques e monte o melhor time sem estourar o orçamento.</p>
  <input id="name" placeholder="Seu nome" maxlength="16">
  <input id="room" placeholder="Código da sala" maxlength="8">
  <button class="pri" onclick="join(false)">Entrar na sala</button>
  <button onclick="join(true)">Criar nova sala</button>
</div>

<div id="game" class="wrap" hidden>
  <div class="top">
    <div><a href="/">← Voltar ao menu</a> · Sala <b id="code" style="font-size:1.3rem"></b></div>
    <div class="row" style="margin:0">
      <button id="vz" onclick="voice=!voice;if(!voice)speechSynthesis.cancel();render()"></button>
      <button id="sz" onclick="sfx=!sfx;render()"></button>
      <button onclick="leave()">Sair</button>
    </div>
  </div>
  <div class="grid">
    <div>
      <div class="panel" id="main"></div>
      <div class="panel" id="bidbar" hidden>
        <div class="row" style="margin:0"><input id="amt" type="number" inputmode="numeric" min="1" step="1" placeholder="Valor" onkeydown="if(event.key==='Enter')bidFree()">
          <button class="pri" onclick="bidFree()">Dar lance</button><span id="quick" class="row" style="margin:0"></span></div>
        <div id="hint" class="mu" style="font-size:.85rem;margin-top:.4rem"></div>
      </div>
      <div class="panel" id="pitch"></div>
      <div class="log" id="log"></div>
    </div>
    <div>
      <div class="panel" id="players"></div>
      <div class="panel"><div class="mu" style="font-size:.85rem;margin-bottom:.3rem">CHAT</div><div id="chatlog"></div>
        <div class="row" style="margin:0"><input id="chatin" maxlength="140" placeholder="Digite sua mensagem" onkeydown="if(event.key==='Enter')sendChat()" style="flex:1;width:auto"><button onclick="sendChat()">Enviar</button></div></div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const PN = { GK: 'Goleiro', DEF: 'Defensor', MID: 'Meia', ATT: 'Atacante' };
const ROLE = { GOL: 'Goleiro', ZAG: 'Zagueiro', LD: 'Lateral-direito', LE: 'Lateral-esquerdo', VOL: 'Volante', MC: 'Meio-campista', MEI: 'Meia-atacante', PE: 'Ponta-esquerda', PD: 'Ponta-direita', CA: 'Centroavante' };
const tag = x => x.club ? ` <span class="mu">(${esc(x.role)} · ${esc(x.club)})</span>` : '';
const PK = { todos: 'Todos (atuais + lendas)', atuais: 'Só craques atuais', lendas: 'Só lendas' };
let ws, S = null, name = '', room = '', voice = true, sfx = true, viewId = null, ac = null;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const send = m => ws && ws.readyState === 1 && ws.send(JSON.stringify(m));
const nm = id => (S.players.find(p => p.id === id) || {}).name || '';
const score = p => p.squad.reduce((s, x) => s + x.r, 0);
const cfg = (k, v) => send({ t: 'cfg', k, v });
const store = { get() { try { return JSON.parse(localStorage.getItem('leilao_s')); } catch { return null; } }, set(v) { try { v ? localStorage.setItem('leilao_s', JSON.stringify(v)) : localStorage.removeItem('leilao_s'); } catch {} } };

$('room').value = (new URLSearchParams(location.search).get('sala') || '').toUpperCase();
const saved = store.get(); if (saved) { name = saved.name; room = saved.room; $('name').value = name; $('room').value = room; connect(); }

function join(create) {
  name = $('name').value.trim(); room = (create ? Math.random().toString(36).slice(2, 6) : $('room').value).trim().toUpperCase();
  if (!name || !room) return alert('Informe seu nome e o código da sala.');
  connect();
}
function leave() { store.set(null); location.href = '/leilao'; }
let lastMsg = Date.now(), retry = null;
function connect() {
  if (ws && ws.readyState <= 1) return;
  clearTimeout(retry);
  const w = ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
  w.onopen = () => { lastMsg = Date.now(); send({ t: 'join', room, name, re: !!(S || saved) }); };
  w.onmessage = e => {
    lastMsg = Date.now();
    const m = JSON.parse(e.data);
    if (m.t === 'state') { if (!S) store.set({ name, room }); S = m; S.at = Date.now(); render(); }
    else if (m.t === 'say') { speak(m.text); fx(m.fx); }
    else if (m.t === 'kicked') { store.set(null); alert('Você foi removido da sala.'); location.href = '/leilao'; }
    else if (m.t === 'err') {
      if (/não existe mais/.test(m.text)) { store.set(null); alert(m.text); location.href = '/leilao'; return; }
      if (/acabou de ser vendido/.test(m.text)) return; // lance que chegou tarde: sem alerta
      alert(m.text); if (!S) { store.set(null); $('join').hidden = false; $('game').hidden = true; }
    }
  };
  w.onclose = () => { if (w === ws && (S || saved)) retry = setTimeout(connect, 2000); }; // reconecta sozinho
}
function reconnect() { const w = ws; if (w) { w.onclose = null; try { w.close(); } catch (e) {} } ws = null; clearTimeout(retry); connect(); }
setInterval(() => { // vigia da conexão: avisa quando cair e reconecta se o servidor ficar mudo
  const off = !!S && !(ws && ws.readyState === 1); $('net').hidden = !off;
  if (S && Date.now() - lastMsg > 50000) reconnect(); else if (S && (!ws || ws.readyState > 1)) connect();
}, 2000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && S && Date.now() - lastMsg > 30000) reconnect(); });

// ===== Voz do narrador e efeitos sonoros =====
function speak(t) {
  if (!voice || !window.speechSynthesis) return;
  speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = 'pt-BR'; u.rate = 1.1; speechSynthesis.speak(u);
}
function tone(f, d = .12, type = 'sine', v = .12, t0 = 0) {
  if (!sfx) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + t0;
    o.type = type; o.frequency.value = f; o.connect(g); g.connect(ac.destination);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + d); o.start(t); o.stop(t + d);
  } catch {}
}
function fx(k) {
  if (k === 'bid') tone(660, .1);
  else if (k === 'once') tone(440, .2, 'triangle');
  else if (k === 'twice') { tone(440, .15, 'triangle'); tone(523, .2, 'triangle', .14, .2); }
  else if (k === 'sold') [523, 659, 784, 1046].forEach((f, i) => tone(f, .18, 'square', .08, i * .1));
  else if (k === 'pass') tone(180, .35, 'sawtooth', .08);
  else if (k === 'gavel') { tone(140, .12, 'square', .15); tone(140, .12, 'square', .15, .16); }
}

// ===== Telas =====
function cfgHtml(host) {
  const c = S.cfg, forms = { 7: ['2-3-1', '3-2-1', '2-2-2'], 8: ['3-3-1', '2-3-2', '3-2-2'], 9: ['3-3-2', '4-3-1', '3-4-1'], 10: ['4-3-2', '3-4-2', '4-4-1', '3-3-3'], 11: ['4-3-3', '4-4-2', '3-5-2', '5-3-2', '4-5-1', '3-4-3'] };
  const sel = (k, opts, cur, f = x => x) => host ? `<select onchange="cfg('${k}',this.value)">${opts.map(o => `<option value="${o}" ${o == cur ? 'selected' : ''}>${f(o)}</option>`).join('')}</select>` : `<b>${f(cur)}</b>`;
  const chk = (k, on, dis = false) => host ? `<input type="checkbox" style="width:auto" ${on ? 'checked' : ''} ${dis ? 'disabled' : ''} onchange="cfg('${k}',this.checked)">` : `<b>${on ? 'Sim' : 'Não'}</b>`;
  const packs = S.packs.map(k => host ? `<label style="display:block"><input type="checkbox" style="width:auto" ${c.packs.includes(k.id) ? 'checked' : ''} onchange="setPack('${k.id}',this.checked)"> ${esc(k.label)}</label>` : (c.packs.includes(k.id) ? `<div><b>${esc(k.label)}</b></div>` : '')).join('');
  return `<div class="cfg">
    <span>Orçamento</span>${sel('budget', [100, 150, 200, 300, 500], c.budget, x => '€ ' + x + 'M')}
    <span>Jogadores por time</span>${sel('size', [7, 8, 9, 10, 11], c.size)}
    <span>Formação</span>${sel('form', forms[c.size], c.form)}
    <span>Tempo por jogador</span>${sel('bidSec', [8, 12, 15, 20, 30], c.bidSec, x => x + 's')}
    <span>Pacotes de craques</span><div>${packs}</div>
    <span>Torneio entre os times do leilão</span>${chk('torneio', c.torneio)}
    <span>Copa do Mundo simulada</span>${chk('copa', c.copa, !S.copaOk)}
    ${c.copa ? `<span>Formato da Copa</span>${sel('fmt', [32, 48], c.fmt, x => x + ' seleções')}` : ''}</div>`;
}
function setPack(id, on) { const ids = S.packs.map(k => k.id).filter(x => (x === id ? on : S.cfg.packs.includes(x))); if (!ids.length) { alert('Escolha pelo menos um pacote de craques.'); return render(); } cfg('packs', ids); }
function shareLink() { return location.origin + '/leilao?sala=' + S.code; }
function copyLink() { const t = shareLink(); (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => alert('Link copiado!'), () => prompt('Copie o link:', t)); }
function whats() { window.open('https://wa.me/?text=' + encodeURIComponent('Vem jogar o Leilão de Futebol comigo! ' + shareLink()), '_blank'); }
function warnHtml() {
  return (S.warn || []).map(w => `<div style="padding:.5rem .7rem;border-radius:6px;margin-bottom:.8rem;background:${w.crit ? '#5c1f24' : '#4a3a0c'};border:1px solid ${w.crit ? 'var(--bad)' : 'var(--ac)'}">
    ⚠️ ${w.crit ? 'Faltam' : 'Estão acabando os'} ${{ GK: 'goleiros', DEF: 'defensores', MID: 'meias', ATT: 'atacantes' }[w.pos]}: restam <b>${w.left}</b> para <b>${w.need}</b> vagas${S.round > 1 ? ' (rodada ' + S.round + ')' : ''}.</div>`).join('');
}
function render() {
  if (!S) return;
  $('join').hidden = true; $('game').hidden = false; $('code').textContent = S.code;
  $('vz').textContent = 'Narrador: ' + (voice ? 'ligado' : 'desligado'); $('sz').textContent = 'Som: ' + (sfx ? 'ligado' : 'desligado');
  const me = S.players.find(p => p.id === S.you), isHost = S.you === S.host; let h = '';
  if (S.phase === 'lobby') {
    h = `<h2 style="font-size:2.2rem">Sala de espera</h2><p>Link para convidar: <b>${esc(shareLink())}</b></p><div class="row" style="margin:0 0 .6rem"><button onclick="copyLink()">📋 Copiar link</button><button onclick="whats()">💬 Enviar no WhatsApp</button></div>
      <p class="mu">${isHost ? 'Você é o anfitrião: ajuste as regras abaixo.' : 'Regras definidas pelo anfitrião:'}</p>${cfgHtml(isHost)}
      ${isHost ? `<button class="pri" onclick="send({t:'start'})">Iniciar leilão</button>` : '<p>Aguardando o anfitrião iniciar…</p>'}`;
  } else if (S.phase === 'end') h = endHtml(isHost);
  else if (!S.lot) h = warnHtml() + `<h2 style="font-size:2.2rem">Preparando o próximo jogador…</h2>`;
  else {
    const l = S.lot, can = me.need[l.pos] > 0 && l.bidder !== me.id;
    h = warnHtml() + `<div class="lot"><span class="pos">${l.role ? esc(ROLE[l.role]) : PN[l.pos]}</span>${l.club ? ` <span class="pos" style="background:#2a5782;color:var(--tx)">${esc(l.club)}</span>` : ''}<h1>${esc(l.n)}</h1><div class="mu">Nota ${l.r}</div>
      <div class="big">€ ${l.bidder ? l.bid : l.base}M</div>
      <div>${l.bidder ? `Maior lance: <b>${esc(nm(l.bidder))}</b>` : 'Ninguém deu lance ainda'}</div>
      <div class="track"><div id="bar"></div></div><div id="tm" class="mu"></div>
      ${me.need[l.pos] < 1 ? '<p class="bad">Você já completou essa posição.</p>' : l.bidder === me.id ? '<p class="ok">Seu lance está na frente.</p>' : ''}
      ${!l.bidder && me.need[l.pos] > 0 ? `<button ${l.skips.includes(me.id) ? 'disabled' : ''} onclick="send({t:'skip'})">⏭ ${l.skips.includes(me.id) ? 'Aguardando' : 'Pular'} (${l.skips.length}/${l.skipNeed})</button>` : ''}</div>`;
    bar(l, me, can);
  }
  if (!S.lot || S.phase !== 'auction') $('bidbar').hidden = true;
  $('main').innerHTML = h;
  $('players').innerHTML = S.players.map(p => `<div class="pl ${p.id === S.you ? 'me' : ''}"><b>${esc(p.name)}</b>${p.id === S.host ? ' 👑' : ''}${p.on ? '' : ' <span class="bad">(offline)</span>'}
    <span class="mu" style="float:right">€ ${p.budget}M · ${p.squad.length}/${S.total}${isHost && p.id !== S.you ? `<button class="x" title="Tornar anfitrião" onclick="send({t:'host',id:'${p.id}'})">👑</button><button class="x" title="Remover da sala" onclick="if(confirm('Remover ${esc(p.name)} da sala?'))send({t:'kick',id:'${p.id}'})">✕</button>` : ''}</span><br>
    ${p.squad.map(x => `<span class="chip">${esc(x.n)} · ${x.price}M${tag(x)}</span>`).join('') || '<span class="mu">Sem jogadores</span>'}</div>`).join('') +
    (isHost && S.players.some(p => !p.on) ? `<button style="margin-top:.6rem" onclick="send({t:'kickOffline'})">Remover jogadores offline</button>` : '');
  pitch();
  const cl = $('chatlog'), near = cl.scrollHeight - cl.scrollTop - cl.clientHeight < 40;
  cl.innerHTML = S.chat.map(c => `<div><b>${esc(c.n)}:</b> ${esc(c.t)}</div>`).join(''); if (near) cl.scrollTop = cl.scrollHeight;
  $('log').innerHTML = S.log.map(t => `<div>${esc(t)}</div>`).join('');
}
function bar(l, me, can) { // campo de lance: não é recriado, para não perder o que a pessoa digitou
  const min = l.bidder ? l.bid + 1 : l.base, tmin = l.bidder ? l.bid + 1 : l.floor, a = $('amt');
  $('bidbar').hidden = !can; a.min = tmin; a.max = me.max; a.placeholder = 'mín ' + tmin;
  $('hint').textContent = l.bidder ? `Lance mínimo € ${min}M · você pode dar até € ${me.max}M` : `Primeiro lance: de € ${tmin}M (metade do preço) até € ${me.max}M · preço cheio € ${min}M`;
  $('quick').innerHTML = [0, 4, 9].map(d => min + d).map(v => `<button ${v <= me.max ? '' : 'disabled'} onclick="send({t:'bid',amount:${v}})">€ ${v}M</button>`).join('');
}
function bidFree() { const v = Math.floor(+$('amt').value); if (!(v > 0)) return; send({ t: 'bid', amount: v }); $('amt').value = ''; }
function sendChat() { const i = $('chatin'), t = i.value.trim(); if (t) send({ t: 'chat', text: t }); i.value = ''; }

function endHtml(isHost) {
  const rk = [...S.players].sort((a, b) => score(b) - score(a) || b.budget - a.budget), deal = d => `<tr><td><b>${esc(d.n)}</b> <span class="mu">(nota ${d.r})</span>${tag(d)}</td><td>${esc(d.buyer)}</td><td>€ ${d.price}M</td><td class="${d.v >= 0 ? 'ok' : 'bad'}">${d.v >= 0 ? 'economizou ' + d.v : 'pagou a mais ' + (-d.v)}M</td></tr>`;
  let h = `<h2 style="font-size:2.2rem">Resultado do leilão</h2><table>${rk.map((p, i) => `<tr><td><b>${i + 1}º ${esc(p.name)}</b><br><span class="mu">Nota total ${score(p)} · sobrou € ${p.budget}M</span></td>
    <td>${p.squad.map(x => `<span class="chip">${esc(x.n)} ${x.r}</span>`).join('')}</td></tr>`).join('')}</table>`;
  if (S.sales.length) h += `<h2 style="font-size:1.5rem;margin-top:1rem">Melhores negócios</h2><table>${S.best.map(deal).join('')}</table>
    <h2 style="font-size:1.5rem;margin-top:1rem">Piores negócios</h2><table>${S.worst.map(deal).join('')}</table>
    <details><summary class="mu">Todas as vendas (${S.sales.length})</summary><table>${S.sales.map(d => `<tr><td>${esc(d.n)}${tag(d)}</td><td>${esc(d.buyer)}</td><td>€ ${d.price}M</td></tr>`).join('')}</table></details>`;
  if (S.copaRes) h += `<h2 style="font-size:1.5rem;margin-top:1rem">Copa do Mundo simulada</h2><table>${S.copaRes.map((c, i) => `<tr><td><b>${i + 1}º ${esc(c.name)}</b><br><span class="${c.champ ? 'ok' : 'mu'}">${c.champ ? '🏆 Campeão do mundo' : 'Eliminado: ' + esc(c.out)}</span></td>
    <td>${c.wins}V · ${c.gf}x${c.ga} gols<details><summary class="mu">jogos</summary>${c.matches.map(m => `<div class="${m.won ? 'ok' : m.draw ? '' : 'bad'}">${esc(m.stage)}: ${esc(m.opp)} ${m.gf}–${m.ga}${m.pen ? ' (pên)' : ''}</div>`).join('')}</details></td></tr>`).join('')}</table>`;
  if (S.torneio) h += torneioHtml();
  const hasTeams = S.players.filter(p => p.squad.length).length > 1;
  if (isHost && ((S.copaOk && !S.copaRes) || (hasTeams && !S.torneio))) h += `<p class="row">${S.copaOk && !S.copaRes ? `<button onclick="send({t:'copa'})">🏆 Simular a Copa do Mundo</button>` : ''}${hasTeams && !S.torneio ? `<button onclick="send({t:'torneio'})">⚔️ Torneio entre os times do leilão</button>` : ''}</p>`;
  return h + (isHost ? `<p><button class="pri" onclick="send({t:'again'})">Jogar de novo</button></p>` : '');
}
function torneioHtml() {
  const t = S.torneio, f = t.final, g = m => `<div>${esc(m.a)} <b>${m.ga}–${m.gb}</b> ${esc(m.b)}</div>`;
  return `<h2 style="font-size:1.5rem;margin-top:1rem">Torneio entre os times do leilão</h2>
    <p class="ok" style="margin:.3rem 0">🏆 Campeão: <b>${esc(t.champion)}</b></p>
    ${t.matches.length ? `<table><tr class="mu"><th>Time</th><th>Pts</th><th>V-E-D</th><th>Gols</th></tr>${t.table.map((r, i) => `<tr><td>${i + 1}º ${esc(r.name)}</td><td>${r.pts}</td><td>${r.w}-${r.d}-${r.l}</td><td>${r.gf}x${r.ga}</td></tr>`).join('')}</table>` : ''}
    <div style="margin-top:.5rem"><b>${t.matches.length ? 'Final (1º x 2º)' : 'Final'}:</b> ${esc(f.a)} <b>${f.ga}–${f.gb}</b> ${esc(f.b)}${f.pen ? ' (nos pênaltis: ' + esc(f.winner) + ')' : ''}</div>
    ${t.matches.length ? `<details><summary class="mu">todos os jogos</summary>${t.matches.map(g).join('')}</details>` : ''}`;
}
function pitch() {
  const id = S.players.some(p => p.id === viewId) ? viewId : S.you, p = S.players.find(x => x.id === id);
  const rows = ['ATT', 'MID', 'DEF', 'GK'].map(pos => { const got = p.squad.filter(x => x.pos === pos);
    return '<div class="fr">' + Array.from({ length: S.slots[pos] }, (_, i) => { const x = got[i];
      return x ? `<div class="sl" title="${esc(x.n)}${x.club ? ' — ' + esc(ROLE[x.role]) + ', ' + esc(x.club) : ''} · € ${x.price}M"><div class="dot f">${x.r}</div><small>${esc(x.n)}</small></div>` : '<div class="sl"><div class="dot"></div><small>&nbsp;</small></div>'; }).join('') + '</div>'; }).join('');
  const spent = p.squad.reduce((s, x) => s + x.price, 0), st = (l, v, c = '') => `<div style="flex:1;min-width:5.5rem;background:#0b100d;border-radius:6px;padding:.3rem .5rem"><div class="mu" style="font-size:.75rem">${l}</div><b class="${c}" style="font-size:1.15rem">${v}</b></div>`;
  $('pitch').innerHTML = `<div class="tabs">${S.players.map(q => `<button class="${q.id === id ? 'pri' : ''}" onclick="viewId='${q.id}';render()">${esc(q.name)}</button>`).join('')}</div>
    <div class="row" style="margin:0 0 .6rem;flex-wrap:nowrap">${st('Disponível', '€ ' + p.budget + 'M', 'ok')}${st('Gasto', '€ ' + spent + 'M')}${st('Nota do time', score(p))}${st('Formação', S.cfg.form)}</div>
    <div class="field">${rows}</div>`;
}
setInterval(() => {
  if (S && S.lot && $('bar')) {
    const left = Math.max(0, S.lot.left - (Date.now() - S.at));
    $('bar').style.width = Math.min(100, left / (S.cfg.bidSec * 10)) + '%'; $('bar').style.background = left < 3000 ? 'var(--bad)' : 'var(--ok)';
    $('tm').textContent = (left / 1000).toFixed(1) + 's';
  }
}, 100);
</script>
</body>
</html>
